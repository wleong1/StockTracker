[databases]
; stocks = host=localhost dbname=stocks port=5432 user=postgres password=123456
stocks = host=stocks-postgres dbname=stocks port=5432 user=postgres password=123456

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
logfile = /opt/bitnami/pgbouncer/logs/pgbouncer.log
pidfile = /opt/bitnami/pgbouncer/tmp/pgbouncer.pid
; auth_file = ./pgbouncer/userlist.txt
; logfile = ./pgbouncer/pgbouncer.log
; pidfile = ./pgbouncer/pgbouncer.pid
admin_users = postgres
stats_users = postgres
pool_mode = session
default_pool_size = 20
max_client_conn = 100
reserve_pool_size = 5
reserve_pool_timeout = 5
